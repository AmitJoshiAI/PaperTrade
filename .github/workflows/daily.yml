# Daily paper-trading run. Downloads prices, fills pending orders, writes state/journal/dashboard data,
# then commits the results back to the repo. GitHub Pages serves docs/ from the main branch
# (enable it once in Settings > Pages; see README "Running in the cloud").
name: Daily run

on:
  schedule:
    - cron: "3 12 * * 1-5"    # 12:03 UTC = 17:33 IST, Monday-Friday, after the NSE close (off the :00 slot)
    - cron: "33 12 * * 1-5"   # 12:33 UTC = 18:03 IST retry: a same-date re-run only replaces that day's rows and keeps any review
  workflow_dispatch:          # manual "Run workflow" button in the Actions tab
  push:                       # reliable fallback: any push that touches triggers/daily starts a run
    paths: ["triggers/daily"]

permissions:
  contents: write   # commit and push state/, decisions/, journal/, docs/, theses/ (engine updates status lines)
  pages: write      # request a Pages rebuild after the push

concurrency:
  group: daily-run
  cancel-in-progress: false   # never kill a run halfway through writing state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the daily cycle
        id: run
        # Exit code 3 = Yahoo's prices end BEFORE the last recorded date (papertrade/staleness.py): the run
        # wrote nothing, so this is a clean skip, not a failure. Any other non-zero code fails the job here,
        # and the commit step below (which runs only on success) never runs: no partial commit.
        run: |
          set +e
          python -m papertrade run
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::warning title=Stale data from Yahoo::The price history ends before the last recorded date. Nothing was written or committed; the next run retries."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Commit and push results
        if: steps.run.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state decisions journal docs theses
          if git diff --cached --quiet; then
            echo "Nothing changed; no commit."
            exit 0
          fi
          RUN_DATE=$(python -c "import json; print(json.load(open('docs/data.json'))['as_of'])" 2>/dev/null || date -u +%F)
          git commit -m "daily run ${RUN_DATE}"
          # pick up any review/override pushed from a laptop while this job ran
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Request a GitHub Pages rebuild
        # Pages "Deploy from a branch" normally rebuilds on push by itself; this makes sure a push made
        # with the workflow token also triggers it. Harmless if Pages is not enabled yet.
        if: steps.run.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
